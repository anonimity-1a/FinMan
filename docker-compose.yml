name: finman

services:
  mongo:
    image: mongo:8.0
    # Kernel 6.19+ blocks Mongo 8.x (SERVER-121912). rseq=1 avoids the hard exit.
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } if (!db.hello().isWritablePrimary) quit(1)"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    # No env_file: Portainer Git stacks have no .env on disk. Set the same keys in
    # Portainer → Stack → Environment variables (or a local .env for `docker compose`).
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB: ${MONGODB_DB:-finman}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Portainer env or a local .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Portainer env or a local .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer env or a local .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_VISION_MODEL: ${HF_VISION_MODEL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 0.0.0.0 so phones and other computers on the same Wi-Fi can open the app.
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
